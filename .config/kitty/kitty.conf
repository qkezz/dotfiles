# Kitty configuration

include ./themes/rose-pine-moon.conf

confirm_os_window_close 0
remember_window_size  no
initial_window_width 120c
initial_window_height 30c
shell_integration no-cursor

#Fonts
font_size 11.0
text_composition_strategy 1.0 0
font_family      family="JetBrains Mono" style="Regular"
bold_font        family="JetBrains Mono" style="Bold"
italic_font      family="JetBrains Mono" style="Italic"
bold_italic_font family="JetBrains Mono" style="Bold Italic"

#Cursor
cursor #e0def4
cursor_text_color background
cursor_shape block
cursor_shape_unfocused block
cursor_beam_thickness 1.5
cursor_underline_thickness 1.0
cursor_blink_interval 0.5
cursor_stop_blinking_after 0
cursor_trail 1

#Scrollback
scrollback_lines 2000
scrollbar hovered 
scrollbar_interactive yes
scrollbar_jump_on_click yes
scrollbar_width 1
scrollbar_handle_opacity 0.5 
scrollbar_gap 0
scrollbar_min_handle_height 1
scrollbar_hitbox_expansion 0.25
scrollbar_track_opacity 1

#Mouse
mouse_hide_wait 1
url_color #0087bd
url_style straight
open_url_with default
terminal_select_modifiers alt
mouse_map middle release ungrabbed paste_from_selection

# English shortcuts
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+q close_os_window
map ctrl+n new_os_window
map ctrl+backspace send_text all \x17
map ctrl+delete    send_text all \x1bd
map ctrl+left      send_text all \x1b[1;5D
map ctrl+right     send_text all \x1b[1;5C
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0     change_font_size all 0
map ctrl+shift+w scroll_line_up
map ctrl+shift+s scroll_line_down
map f11 toggle_fullscreen

#  Русские шорткаты
map ctrl+shift+с copy_to_clipboard
map ctrl+shift+м paste_from_clipboard
map ctrl+й close_os_window
map ctrl+т new_os_window
map ctrl+shift+л scroll_line_up
map ctrl+shift+о scroll_line_down

#Tabs
map ctrl+space new_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab

#Windows (tiling/splits)
enabled_layouts splits,tall,fat,grid,stack
map ctrl+shift+enter launch --location=hsplit
map ctrl+shift+backslash launch --location=vsplit
map ctrl+shift+h neighboring_window left
map ctrl+shift+j neighboring_window down
map ctrl+shift+k neighboring_window up
map ctrl+shift+l neighboring_window right
map ctrl+alt+l next_layout
map ctrl+shift+z toggle_layout stack
map ctrl+shift+r start_resizing_window

#Window layout
window_border_width 1pt
draw_minimal_borders no 
draw_window_borders_for_single_window no 
window_margin_width 1
#                          u r d l
single_window_margin_width 1 1 1 1  
window_padding_width 1
single_window_padding_width 0
