[general]
import = [
    "~/.config/alacritty/rose_pine_moon.toml"
]
live_config_reload = true

[env]
WINIT_X11_SCALE_FACTOR = "1.0"

[window]
dimensions = { columns = 120, lines = 30 }
padding = { x = 1, y = 1 }
dynamic_padding = false 
decorations = "Full"
opacity = 1.0
blur = false
startup_mode = "Windowed"
decorations_theme_variant = "Dark"

[scrolling]
history = 1000
multiplier = 3

[keyboard]
bindings = [
  { key = "C", mods = "Control|Shift", action = "Copy" },
  { key = "V", mods = "Control|Shift", action = "Paste" },
  { key = "Q",   mods = "Control", action = "Quit" },
  { key = "N",   mods = "Control", action = "CreateNewWindow" },
  { key = "F11",               action = "ToggleFullscreen" },
  { key = "Equals", mods = "Control", action = "IncreaseFontSize" },
  { key = "Minus",  mods = "Control", action = "DecreaseFontSize" },
  { key = "Key0",   mods = "Control", action = "ResetFontSize" },
  { key = "Back",   mods = "Control", chars = "\u0017" },
  { key = "Delete", mods = "Control", chars = "\u001bd" },
  { key = "Left",   mods = "Control", chars = "\u001b[1;5D" },
  { key = "Right",  mods = "Control", chars = "\u001b[1;5C" },
  { key = "K", mods = "Control|Shift", action = "ScrollLineUp" },
  { key = "J", mods = "Control|Shift", action = "ScrollLineDown" },
]

[font]
size = 11.0
normal = { family = "JetBrains Mono", style = "Regular" }
bold = { family = "JetBrains Mono", style = "Bold" }
italic = { family = "JetBrains Mono", style = "Italic" }
bold_italic = { family = "JetBrains Mono", style = "Bold Italic" }
offset = { x = 0, y = 0 }

[terminal]
shell = { program = "/usr/bin/zsh", args = ["-l"] }
